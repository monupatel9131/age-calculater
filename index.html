<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator - अपनी सटीक उम्र जानें</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #4a90e2, #50e3c2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            padding: 30px 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }

        input[type="date"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="date"]:focus {
            border-color: #4a90e2;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #4a90e2;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
        }

        button:hover {
            background-color: #357abd;
        }

        button:active {
            transform: scale(0.98);
        }

        .error {
            color: #e74c3c;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }

        .result-box {
            margin-top: 25px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            display: none;
        }

        .result-card {
            background: #f8f9fa;
            padding: 15px 5px;
            border-radius: 10px;
            border: 1px solid #e9ecef;
        }

        .result-card span {
            display: block;
            font-size: 22px;
            font-weight: bold;
            color: #4a90e2;
        }

        .result-card p {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Age Calculator</h1>
        
        <div class="input-group">
            <label for="dob">अपनी जन्म तिथि चुनें:</label>
            <input type="date" id="dob">
        </div>

        <button onclick="calculateAge()">उम्र की गणना करें</button>

        <p class="error" id="error-msg">कृपया एक वैध जन्म तिथि चुनें!</p>

        <div class="result-box" id="result-box">
            <div class="result-card">
                <span id="years">0</span>
                <p>वर्ष</p>
            </div>
            <div class="result-card">
                <span id="months">0</span>
                <p>महीने</p>
            </div>
            <div class="result-card">
                <span id="days">0</span>
                <p>दिन</p>
            </div>
        </div>
    </div>

    <script>
        // भविष्य की तारीख चुनने से रोकने के लिए मैक्स डेट सेट करना
        const dobInput = document.getElementById('dob');
        const today = new Date().toISOString().split('T')[0];
        dobInput.setAttribute('max', today);

        function calculateAge() {
            const dobValue = dobInput.value;
            const errorMsg = document.getElementById('error-msg');
            const resultBox = document.getElementById('result-box');

            if (!dobValue) {
                errorMsg.style.display = 'block';
                resultBox.style.display = 'none';
                return;
            }

            errorMsg.style.display = 'none';

            const birthDate = new Date(dobValue);
            const currentDate = new Date();

            let years = currentDate.getFullYear() - birthDate.getFullYear();
            let months = currentDate.getMonth() - birthDate.getMonth();
            let days = currentDate.getDate() - birthDate.getDate();

            if (days < 0) {
                months--;
                // पिछले महीने के कुल दिनों की संख्या प्राप्त करना
                const lastMonth = new Date(currentDate.getFullYear(), currentDate.getMonth(), 0);
                days += lastMonth.getDate();
            }

            if (months < 0) {
                years--;
                months += 12;
            }

            document.getElementById('years').innerText = years;
            document.getElementById('months').innerText = months;
            document.getElementById('days').innerText = days;

            resultBox.style.display = 'grid';
        }
    </script>

</body>
</html>
